<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 180" width="100%" height="100%">
  <defs>
    <linearGradient id="fe-grad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <linearGradient id="fe-screen" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2563eb" />
      <stop offset="100%" stop-color="#1d4ed8" />
    </linearGradient>
    <filter id="fe-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#000000" flood-opacity="0.4"/>
    </filter>
  </defs>

  <!-- Background container panel -->
  <rect width="240" height="180" rx="12" fill="url(#fe-grad1)"/>

  <!-- Back Monitor Window -->
  <g filter="url(#fe-glow)" transform="translate(30, 20)">
    <!-- Window Frame -->
    <rect width="130" height="90" rx="6" fill="#1e293b" stroke="#334155" stroke-width="1.5"/>
    <!-- Title Bar -->
    <rect width="130" height="16" rx="6" fill="#0f172a"/>
    <circle cx="10" cy="8" r="3" fill="#ef4444"/>
    <circle cx="20" cy="8" r="3" fill="#f59e0b"/>
    <circle cx="30" cy="8" r="3" fill="#10b981"/>
    <!-- Code layout mock -->
    <rect x="10" y="24" width="40" height="6" rx="2" fill="#38bdf8"/>
    <rect x="10" y="36" width="70" height="4" rx="1" fill="#94a3b8" opacity="0.6"/>
    <rect x="10" y="44" width="55" height="4" rx="1" fill="#94a3b8" opacity="0.6"/>
    <rect x="10" y="52" width="80" height="4" rx="1" fill="#f5c32c" opacity="0.8"/>
    <rect x="10" y="60" width="45" height="4" rx="1" fill="#94a3b8" opacity="0.6"/>
    <rect x="10" y="68" width="65" height="4" rx="1" fill="#38bdf8" opacity="0.7"/>
  </g>

  <!-- Front Laptop Window Mock -->
  <g filter="url(#fe-glow)" transform="translate(75, 45)">
    <!-- Monitor Base -->
    <rect width="135" height="100" rx="8" fill="#090d16" stroke="#f5c32c" stroke-width="1.5"/>
    <!-- Header/Nav in web preview -->
    <rect x="2" y="2" width="131" height="18" fill="url(#fe-screen)"/>
    <rect x="10" y="8" width="24" height="6" rx="2" fill="#ffffff"/>
    <rect x="85" y="8" width="12" height="6" rx="1" fill="#ffffff" opacity="0.7"/>
    <rect x="102" y="8" width="12" height="6" rx="1" fill="#ffffff" opacity="0.7"/>
    <rect x="117" y="7" width="10" height="8" rx="2" fill="#f5c32c"/>

    <!-- Hero Card Mock in browser -->
    <rect x="10" y="28" width="115" height="32" rx="4" fill="#1e293b"/>
    <rect x="18" y="34" width="45" height="6" rx="2" fill="#f5c32c"/>
    <rect x="18" y="44" width="65" height="4" rx="1" fill="#cbd5e1"/>
    <rect x="18" y="50" width="50" height="4" rx="1" fill="#cbd5e1" opacity="0.7"/>

    <!-- Grid Columns -->
    <rect x="10" y="66" width="35" height="28" rx="3" fill="#1e293b"/>
    <rect x="15" y="71" width="25" height="10" rx="2" fill="#38bdf8"/>
    <rect x="15" y="85" width="20" height="3" rx="1" fill="#94a3b8"/>

    <rect x="50" y="66" width="35" height="28" rx="3" fill="#1e293b"/>
    <rect x="55" y="71" width="25" height="10" rx="2" fill="#f5c32c"/>
    <rect x="55" y="85" width="20" height="3" rx="1" fill="#94a3b8"/>

    <rect x="90" y="66" width="35" height="28" rx="3" fill="#1e293b"/>
    <rect x="95" y="71" width="25" height="10" rx="2" fill="#10b981"/>
    <rect x="95" y="85" width="20" height="3" rx="1" fill="#94a3b8"/>
  </g>
</svg>
