<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 180" width="100%" height="100%">
  <defs>
    <linearGradient id="js-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <linearGradient id="js-badge" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f7df1e" />
      <stop offset="100%" stop-color="#e5c800" />
    </linearGradient>
    <filter id="js-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#f7df1e" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- Background panel -->
  <rect width="240" height="180" rx="12" fill="url(#js-bg)"/>

  <!-- JS Yellow Badge Container -->
  <g filter="url(#js-glow)" transform="translate(120, 90)">
    <rect x="-55" y="-55" width="110" height="110" rx="12" fill="url(#js-badge)"/>
    <!-- Subtle inner highlight -->
    <rect x="-51" y="-51" width="102" height="102" rx="10" fill="none" stroke="#ffffff" stroke-width="1.5" opacity="0.4"/>
    
    <!-- JS Letters -->
    <text x="35" y="40" font-family="system-ui, -apple-system, sans-serif" font-weight="900" font-size="52" fill="#000000" text-anchor="end" letter-spacing="-2">JS</text>
  </g>
</svg>
