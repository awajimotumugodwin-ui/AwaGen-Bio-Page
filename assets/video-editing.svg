<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 180" width="100%" height="100%">
  <defs>
    <linearGradient id="ve-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <linearGradient id="ve-screen" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e1e2e" />
    </linearGradient>
    <filter id="ve-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#a855f7" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Background panel -->
  <rect width="240" height="180" rx="12" fill="url(#ve-bg)"/>

  <!-- Monitor Window -->
  <g filter="url(#ve-glow)" transform="translate(30, 25)">
    <!-- Monitor Outer Body -->
    <rect width="180" height="115" rx="8" fill="#0f172a" stroke="#475569" stroke-width="1.5"/>
    <rect x="4" y="4" width="172" height="107" rx="6" fill="url(#ve-screen)"/>

    <!-- Video Preview Area -->
    <rect x="12" y="12" width="156" height="60" rx="4" fill="#090d16"/>
    <!-- Play Button Icon -->
    <circle cx="90" cy="42" r="16" fill="#f5c32c" opacity="0.9"/>
    <polygon points="85,34 99,42 85,50" fill="#0f172a"/>

    <!-- Timeline Audio/Video Track Bars -->
    <rect x="12" y="78" width="156" height="4" fill="#334155" rx="2"/>
    <!-- Playhead Vertical Line -->
    <line x1="75" y1="76" x2="75" y2="105" stroke="#f5c32c" stroke-width="2"/>
    <polygon points="71,76 79,76 75,81" fill="#f5c32c"/>

    <!-- Track 1 (Video) -->
    <rect x="12" y="86" width="40" height="6" rx="2" fill="#ec4899"/>
    <rect x="56" y="86" width="60" height="6" rx="2" fill="#8b5cf6"/>
    <rect x="120" y="86" width="48" height="6" rx="2" fill="#06b6d4"/>

    <!-- Track 2 (Audio) -->
    <rect x="12" y="96" width="70" height="6" rx="2" fill="#3b82f6"/>
    <rect x="86" y="96" width="50" height="6" rx="2" fill="#10b981"/>
  </g>
  <!-- Monitor Stand -->
  <path d="M105,140 L135,140 L140,158 L100,158 Z" fill="#334155"/>
  <rect x="90" y="157" width="60" height="4" rx="2" fill="#475569"/>
</svg>
